<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#0A0A0C">
<title>Admin · Sunil Trading Co.</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="admin.css">
</head>
<body>

<!-- ══════════ LOGIN ══════════ -->
<div id="loginView" class="login-shell">
  <div class="login-card">
    <svg class="login-mark" viewBox="0 0 32 32" aria-hidden="true">
      <defs>
        <linearGradient id="lg" x1="0%" y1="0%" x2="100%" y2="100%">
          <stop offset="0%" stop-color="#3B82F6"/>
          <stop offset="100%" stop-color="#D89A3D"/>
        </linearGradient>
      </defs>
      <path d="M16 2 C 16 2, 5 15, 5 21 a 11 11 0 0 0 22 0 C 27 15, 16 2, 16 2 Z" fill="url(#lg)"/>
    </svg>
    <h1>Admin sign in</h1>
    <p>Sunil Trading Co. — analytics &amp; catalogue</p>
    <input type="password" id="pw" placeholder="Password" autocomplete="current-password">
    <button onclick="login()">Sign in</button>
    <p class="login-error" id="loginError"></p>
  </div>
</div>


<!-- ══════════ DASHBOARD ══════════ -->
<div id="dashView" class="dash hidden">

  <header class="topbar">
    <span class="topbar-title" id="topTitle">Analytics</span>
    <button class="icon-btn" onclick="logout()" aria-label="Logout">
      <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round">
        <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4M16 17l5-5-5-5M21 12H9"/>
      </svg>
    </button>
  </header>

  <main class="dash-main">

    <!-- ═══════ ANALYTICS PANEL ═══════ -->
    <section id="tab-analytics" class="tab-panel">

      <div class="welcome">
        <h1 id="greeting">Good Morning</h1>
        <p id="todayDate">Monday, October 3</p>
      </div>

      <div class="range-chips">
        <button class="chip active" data-days="7">7 days</button>
        <button class="chip" data-days="14">14 days</button>
        <button class="chip" data-days="30">30 days</button>
      </div>

      <!-- Stat cards with sparklines -->
      <div class="stat-grid" id="statGrid">
        <div class="stat-card skeleton"></div>
        <div class="stat-card skeleton"></div>
        <div class="stat-card skeleton"></div>
        <div class="stat-card skeleton"></div>
      </div>

      <!-- Activity chart -->
      <article class="card">
        <div class="card-head">
          <h2>Activity</h2>
          <span class="card-sub" id="activitySub">Last 7 days</span>
        </div>
        <div class="chart-legend">
          <span><i class="dot dot-blue"></i>Page views</span>
          <span><i class="dot dot-green"></i>Product views</span>
          <span><i class="dot dot-amber"></i>WhatsApp</span>
        </div>
        <div class="chart" id="chart"></div>
        <div class="chart-labels" id="chartLabels"></div>
      </article>

      <!-- Top products -->
      <article class="card">
        <div class="card-head">
          <h2>Top products viewed</h2>
        </div>
        <div id="topProducts" class="list-block"></div>
      </article>

      <!-- Top pages -->
      <article class="card">
        <div class="card-head">
          <h2>Top pages</h2>
        </div>
        <div id="topPages" class="list-block"></div>
      </article>

      <!-- Recent events -->
      <article class="card">
        <div class="card-head">
          <h2>Recent events</h2>
          <button class="text-btn" onclick="loadEvents()">Refresh</button>
        </div>
        <div id="eventsList" class="events-list"></div>
      </article>

    </section>


    <!-- ═══════ PRODUCTS PANEL ═══════ -->
    <section id="tab-products" class="tab-panel hidden">

      <div class="panel-head">
        <h1>Products</h1>
        <button class="btn-pill" onclick="openSheet()">
          <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M12 5v14M5 12h14"/>
          </svg>
          Add
        </button>
      </div>

      <div id="productsList" class="products-list"></div>

    </section>

  </main>

  <!-- ═══════ BOTTOM TABS ═══════ -->
  <nav class="bottom-tabs">
    <button class="tab-btn active" data-tab="analytics" onclick="switchTab('analytics')">
      <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round">
        <path d="M3 3v18h18"/><path d="M7 14l4-4 4 4 5-5"/>
      </svg>
      <span>Analytics</span>
    </button>
    <button class="tab-btn" data-tab="products" onclick="switchTab('products')">
      <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round">
        <path d="M3 7l9-4 9 4-9 4z"/><path d="M3 7v10l9 4 9-4V7"/>
      </svg>
      <span>Products</span>
    </button>
  </nav>
</div>


<!-- ══════════ PRODUCT SHEET ══════════ -->
<div id="productSheet" class="sheet-wrap hidden">
  <div class="sheet-backdrop" onclick="closeSheet()"></div>
  <div class="sheet">
    <div class="sheet-handle"></div>
    <header class="sheet-head">
      <h2 id="sheetTitle">Add product</h2>
      <button class="icon-btn" onclick="closeSheet()" aria-label="Close">×</button>
    </header>

    <div class="sheet-body">

      <!-- Photo uploader -->
      <input type="file" id="photoInput" accept="image/*" hidden>
      <button class="photo-uploader" id="photoBtn" onclick="document.getElementById('photoInput').click()">
        <img id="photoPreview" src="" alt="" class="hidden">
        <div class="photo-placeholder" id="photoPlaceholder">
          <svg viewBox="0 0 24 24" width="26" height="26" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round">
            <path d="M23 19a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4l2-3h6l2 3h4a2 2 0 0 1 2 2z"/>
            <circle cx="12" cy="13" r="4"/>
          </svg>
          <span id="photoLabel">Tap to add photo</span>
          <small>Take a photo or choose from gallery</small>
        </div>
      </button>

      <label class="field">
        <span>Name *</span>
        <input id="f_name" type="text" placeholder="e.g. Premium Waterproof Raincoat">
      </label>

      <label class="field">
        <span>Category *</span>
        <div class="segmented" id="f_category">
          <button type="button" data-value="raincoat" class="seg active">Raincoat</button>
          <button type="button" data-value="jacket" class="seg">Jacket</button>
        </div>
      </label>

      <label class="field">
        <span>Price</span>
        <input id="f_price" type="text" placeholder="₹1,299 or Contact for bulk pricing">
      </label>

      <label class="field">
        <span>Description</span>
        <textarea id="f_description" rows="3" placeholder="Short description of the product"></textarea>
      </label>

      <label class="field">
        <span>Features <small>comma separated</small></span>
        <input id="f_features" type="text" placeholder="Waterproof, Durable, Comfortable">
      </label>

      <div class="field-row">
        <label class="field">
          <span>Sizes</span>
          <input id="f_sizes" type="text" placeholder="M,L,XL,XXL">
        </label>
        <label class="field">
          <span>Colors</span>
          <input id="f_colors" type="text" placeholder="Black, Navy, Yellow">
        </label>
      </div>

      <label class="field">
        <span>Tag <small>optional, e.g. "Popular"</small></span>
        <input id="f_tag" type="text" placeholder="Popular">
      </label>

      <label class="toggle-row">
        <span>Hide from public site</span>
        <input type="checkbox" id="f_hidden">
      </label>

      <p class="sheet-error" id="sheetError"></p>
    </div>

    <footer class="sheet-foot">
      <button class="btn-secondary" onclick="closeSheet()">Cancel</button>
      <button class="btn-primary" id="saveBtn" onclick="saveProduct()">Save product</button>
    </footer>
  </div>
</div>

<script src="admin.js"></script>
</body>
</html>
